# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
#
# NOTE: This workflow is overkill for most R packages and
# check-standard.yaml is likely a better choice.
# usethis::use_github_action("check-standard") will install it.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: instrumented
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""
      extra-packages:
        description: 'extra package to install for the runs (like a dev version of one of the deps) - comma separated'
        required: false
        type: string

name: R-CMD-check

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}-${{ inputs.leg || 'push' }}-${{ inputs.racecar_run }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  # The one variable that separates the arms: on baseline, action-checkout
  # skips its Set up Chalk step entirely.
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}

run-name: "R-CMD-check ${{ inputs.leg || 'push' }} ${{ inputs.racecar_run }}"

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})${{ github.event.inputs.extra-packages && ' - with some extra packages'|| ''}}
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}
          - {os: ubuntu-latest,  r: 'oldrel-2'}
          - {os: ubuntu-latest,  r: 'oldrel-3'}
          - {os: ubuntu-latest,  r: 'oldrel-4', extra-packages: 'magick@2.8.5'}

    env:
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true
      DISPLAY: ':99.0'
      RGL_USE_NULL: TRUE
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - name: Checkout code
        uses: crashappsec/action-checkout@main
        with:
          chalk: ${{ env.CHALK_ON }}
          profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          observables_continue_on_error: false
          lfs: false
      - name: Assert instrumentation is live
        if: env.CHALK_ON == 'true'
        run: |
          test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
          test -S "${CURIOSITY_SOCKET_NAME:?socket name unset}" || { echo "::error::co-hostd socket absent"; exit 1; }

      - uses: r-lib/actions/setup-r@v2.13.0
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-tinytex@v2.13.0
        env:
          # install full prebuilt version
          TINYTEX_INSTALLER: TinyTeX

      - if: github.event.inputs.extra-packages
        run: |
          echo "::notice::Running with the following extra packages for pak: ${{ github.event.inputs.extra-packages }}"
        shell: bash

      - uses: r-lib/actions/setup-r-dependencies@v2.13.0
        with:
          extra-packages: >
            any::rcmdcheck,
            gridSVG=?ignore-before-r=4.0.0,
            targets=?ignore-before-r=4.0.0,
            JuliaCall=?ignore-before-r=4.0.0,
            magick=?ignore-before-r=4.0.0,
            ${{ matrix.config.extra-packages && format('{0},', join(matrix.config.extra-packages, ',')) }}
            ${{ github.event.inputs.extra-packages }}
          needs: check

      - uses: r-lib/actions/check-r-package@v2.13.0
        env:
          _R_CHECK_FORCE_SUGGESTS_: false
        with:
          upload-snapshots: true

      - name: Test coverage
        if: success() && runner.os == 'Linux' && matrix.config.r == 'release'
        run: |
          pak::pak("covr")
          covr::codecov()
        shell: Rscript {0}
